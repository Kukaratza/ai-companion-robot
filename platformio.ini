[platformio]
default_envs = esp32s3

[env:esp32s3]
; pioarduino gives Arduino core 3.x (needed for ESP_I2S.h)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
; For the wake word ("Hi, ESP!") use the ESP-SR partition table instead: esp_sr_16.csv
board_build.partitions = default_16MB.csv
build_src_filter = +<*> -<face_demo.cpp> -<button_test.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -DWEBSOCKETS_MAX_DATA_SIZE=65536
lib_deps =
    links2004/WebSockets@^2.6.1
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9

; Step 1 for kids: upload ONLY the face (no mic/speaker/WiFi needed)
[env:face_demo]
extends = env:esp32s3
build_src_filter = -<*> +<face.cpp> +<face_demo.cpp>

; Find which two wires of the push button are the switch
[env:button_test]
extends = env:esp32s3
build_src_filter = -<*> +<button_test.cpp>
